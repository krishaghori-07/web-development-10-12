<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="success.html" method="post">
        <table border="1" cellpadding="10"  align="center" width="50%">
            <tr>
                <th bgcolor="yellow">compose email</th>
            </tr>
            <tr>
                <td><input type="email" id="email" placeholder="enter your email address" required></td>
            </tr>
            <tr>
                <td><input type="text" id="subject" placeholder="enter your subject" required></td>
            </tr>
            <tr>
                <td bgcolor="#eeeee">
                    Attachment
                </td>
            </tr>
            <tr>
                <td>
                    <input type="file" name="Attachment" id="Attachment"
                    multiple accept=".doc,.docx,.xls,.xlsx,.ppt.pptx,.pdf">
                </td>
            </tr>
            <tr>
                <td>
                    <textarea name="address" id="address" required
                    placeholder="your address"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="submit">send email</button>
                    <button type="reset">clear all</button>
                    <button type="button">i can't do anything </button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
